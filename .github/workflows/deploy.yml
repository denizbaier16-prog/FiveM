name: Deploy EXO RP scripts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'tools/deploy_sftp.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: exo-rp-sftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out FiveM scripts
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SFTP client
        run: python -m pip install 'paramiko>=3.5,<5'
      - name: Upload to Gaming4Free
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_FINGERPRINT: ${{ secrets.SFTP_HOST_FINGERPRINT }}
          SFTP_REMOTE_ROOT: ${{ vars.SFTP_REMOTE_ROOT }}
        run: python tools/deploy_sftp.py
